    <main>
      <!-- id="topo" -->
      <form class="form">
        <h2 class="texto-form">Login</h2>
        <div class="campos">
          <label for="ex-nome">Nome de usuário</label>
          <input
            type="text"
            id="ex-nome"
            name="nome"
            placeholder="Ex.: Maria"
            required
          />
        </div>
        <div class="campos">
          <label for="ex-senha">Senha</label>
          <input
            type="password"
            id="ex-senha"
            name="senha"
            placeholder="Digite sua senha"
            required
          />
        </div>
        <div class="campos">
          <label for="ex-email">E-mail</label>
          <input
            type="email"
            id="ex-email"
            name="email"
            placeholder="seu@email.com"
            required
          />
        </div>
        <button type="submit">Enviar</button>
        <br /><br />
        <button type="reset">Resetar</button>
      </form>
    </main>
